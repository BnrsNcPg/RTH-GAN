# Engineering smoke settings only; not the paper's unreported hyperparameters.
experiment_name: rthgan_landsat8_seed42_smoke
seed: 42
device: cpu
training:
  pinn_epochs: 1
  warmup_epochs: 1
  adversarial_epochs: 1
  batch_size: 1
  num_workers: 0
  max_batches: 1
  learning_rate_pinn: 0.001
  learning_rate_g: 0.0002
  learning_rate_d: 0.0002
  beta1: 0.5  # G/D only; PINN Adam uses fixed defaults (0.9, 0.999)
  beta2: 0.999
  lambda_l1: 100.0
  lambda_hac: 1.0
  discriminator_steps: 1
model:
  discriminator_channels: 4
  generator:
    widths: [4, 8, 16, 32]
    depths: [1, 1, 1, 1]
    feature_channels: 8
    masks: 3
    attention_heads: 2
    pinn:
      hidden_channels: 8
      hidden_layers: 1
      positional_frequencies: 1
      num_interior_points: 16
      num_boundary_points: 8
